[package]
name = "repobeats"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Generate a GitHub repository activity card as an SVG file from a GitHub Action, with no OAuth login or hosted service"
repository = "https://github.com/spatelpatidar/repobeats"

[dependencies]
anyhow = "1.0.99"
form_urlencoded = "1.2.2"
chrono = { version = "0.4.41", features = ["serde"] }
octocrab = "0.54.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
svg = "0.18.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }

[features]
# The HTTP server and its params page: `cargo run --features server --bin repobeats-server`.
# Off by default so the GitHub Action image does not carry a web stack.
server = ["dep:axum"]

[[bin]]
name = "repobeats"
path = "src/main.rs"

[[bin]]
name = "repobeats-server"
path = "src/server.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
