name: Showcase

# Regenerates the example cards using this repository's own Action and publishes
# them to the `output` branch (nothing is committed to main).
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Activity (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: light
          period: 90
          filename: showcase/activity-light.svg
          output_action: none

      - name: Activity (dark)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: dark
          period: 90
          filename: showcase/activity-dark.svg
          output_action: none

      - name: Activity (github-dimmed)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: github-dimmed
          period: 90
          filename: showcase/activity-github-dimmed.svg
          output_action: none

      - name: Activity (dracula)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: dracula
          period: 90
          filename: showcase/activity-dracula.svg
          output_action: none

      - name: Activity (nord)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: nord
          period: 90
          filename: showcase/activity-nord.svg
          output_action: none

      - name: Activity (tokyo-night)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: tokyo-night
          period: 90
          filename: showcase/activity-tokyo-night.svg
          output_action: none

      - name: Activity (solarized-light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: activity
          theme: solarized-light
          period: 90
          filename: showcase/activity-solarized-light.svg
          output_action: none

      - name: Contributors
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: contributors
          theme: dark
          period: 90
          filename: showcase/contributors-dark.svg
          output_action: none

      - name: Languages (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: lowlighter/metrics
          card: languages
          theme: light
          filename: showcase/languages-light.svg
          output_action: none

      - name: Languages (dracula)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: lowlighter/metrics
          card: languages
          theme: dracula
          filename: showcase/languages-dracula.svg
          output_action: none

      - name: Overview (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          card: overview
          theme: light
          filename: showcase/overview-light.svg
          output_action: none

      - name: Overview (nord)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: lowlighter/metrics
          card: overview
          theme: nord
          filename: showcase/overview-nord.svg
          output_action: none

      - name: Publish cards to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: showcase
          keep_files: false
          force_orphan: true
          commit_message: "chore: update showcase cards"