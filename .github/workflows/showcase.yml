name: Showcase

# Regenerates the example cards using this repository's own Action and publishes
# them to the `output` branch (nothing is committed to main).
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Card - spatelpatidar/repobeats (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: spatelpatidar/repobeats
          theme: light
          period: 90
          filename: showcase/repobeats-light.svg
          output_action: none

      - name: Card - spatelpatidar/repobeats (dark)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: spatelpatidar/repobeats
          theme: dark
          period: 90
          filename: showcase/repobeats-dark.svg
          output_action: none

      - name: Card - Platane/snk (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          theme: light
          period: 90
          filename: showcase/snk-light.svg
          output_action: none

      - name: Card - Platane/snk (dark)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: Platane/snk
          theme: dark
          period: 90
          filename: showcase/snk-dark.svg
          output_action: none

      - name: Card - lowlighter/metrics (light)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: lowlighter/metrics
          theme: light
          period: 90
          filename: showcase/metrics-light.svg
          output_action: none

      - name: Card - lowlighter/metrics (dark)
        uses: ./
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: lowlighter/metrics
          theme: dark
          period: 90
          filename: showcase/metrics-dark.svg
          output_action: none

      - name: Publish cards to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: showcase
          keep_files: false
          force_orphan: true
          commit_message: "chore: update showcase cards"