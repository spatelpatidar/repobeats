name: Repobeats
description: Render a repository activity card (issues, pull requests, pushes, top contributors) as an SVG file. Runs on your runner with your token. No login, no hosted service.
author: spatelpatidar
branding:
  icon: activity
  color: purple

inputs:
  token:
    description: GitHub token used to read repository data. `secrets.GITHUB_TOKEN` works for the current repository. Use a personal access token with read access to contents, issues and pull requests for another private repository. Leave empty for public repositories (60 requests/hour, may hit limits).
    required: false
    default: ''
  user:
    description: Repository owner. Only needed when `repo` is a bare name. Defaults to the owner of the current repository.
    required: false
    default: ''
  repo:
    description: Repository as `owner/name`, or a bare name together with `user`. Defaults to the current repository.
    required: false
    default: ''
  card:
    description: "Which card to draw: `activity` (issues, pull requests, pushes, top contributors), `languages` (language breakdown), `contributors` (ranked contributors with bars) or `overview` (stars, forks, issues, license, last push, latest release) or `graph` (line graph of daily contributions, see `graph_options`)."
    required: false
    default: activity
  theme:
    description: "`light`, `dark`, `github-dimmed`, `dracula`, `nord`, `tokyo-night` or `solarized-light`."
    required: false
    default: light
  colors:
    description: "Custom colors, 4 or 5 hex codes separated by commas. Replaces `theme`. The position sets the role: 0 background (or `transparent`), 1 primary (titles, header, Issues, contributors), 2 secondary (Pull Requests), 3 text, 4 tertiary (Pushes, optional). Example: `0d1117,58a6ff,bc8cff,e6edf3,f78166`. Write the codes without `#`, or quote the whole value, because YAML treats `#` as a comment."
    required: false
    default: ''
  animate:
    description: "`true` (default) plays entrance animations and a few slow loops. `false` writes a static card. Viewers with reduced motion enabled always get a static card."
    required: false
    default: 'true'
  size:
    description: "Width of the card: `small` (610px), `medium` (814px) or `large` (1221px). Height follows the card."
    required: false
    default: medium
  period:
    description: "Days to summarise: 7, 14, 30, 90, 180 or 365. Used by the `activity` and `contributors` cards."
    required: false
    default: '30'
  graph_options:
    description: "Only for `card: graph`. URL query string with the graph options, for example `days=31&area=true&line=58a6ff&point=f78166`. Supported: days, from, to, metric, area, grid, smooth, hide_title, custom_title, hide_border, radius, height, bg_color, border_color, color, title_color, line, point, area_color."
    required: false
    default: ''
  filename:
    description: Path of the SVG file to write, relative to the workspace.
    required: false
    default: repobeats.svg
  max_pages:
    description: Maximum API pages (100 items each) to read per list. Raise it for very active repositories.
    required: false
    default: '50'
  output_action:
    description: "`none` leaves the file in the workspace for later steps. `commit` commits and pushes it to the checked-out branch (needs `contents: write`)."
    required: false
    default: none
  commit_message:
    description: Commit message used when `output_action` is `commit`.
    required: false
    default: 'chore: update repobeats card'

runs:
  using: docker
  image: docker://ghcr.io/spatelpatidar/repobeats:v0.4.0